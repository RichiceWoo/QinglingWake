spring:
  application:
    name: qingling-team
  config:
    import: optional:file:./config.yaml

qingling:
  workspace:
    id: qingling-team
    name: Qingling Team
    root: ${QINGLING_WORKSPACE_ROOT:./workspace}
  data-dir: ${QINGLING_DATA_DIR:./data}
  feishu:
    enabled: ${QINGLING_FEISHU_ENABLED:false}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    allowed-chats: []
  agent:
    # 父 Agent 与子 Agent 首版共用同一供应商；默认保持 DashScope 向后兼容。
    provider: ${QINGLING_MODEL_PROVIDER:dashscope}
    model: ${QINGLING_AGENT_MODEL:qwen3-max}
    sub-agent-model: ${QINGLING_SUB_AGENT_MODEL:qwen3-max}
    # 新变量优先；旧动态选择变量仅作为兼容回退，默认关闭免费模型探测。
    free-model-selection-enabled: ${QINGLING_FREE_MODEL_SELECTION_ENABLED:${QINGLING_DYNAMIC_MODEL_SELECTION_ENABLED:false}}
    # 普通运行默认不额外调用模型；真实 E2E 显式开启后在启动阶段验证模型与 Function Calling。
    validate-explicit-model: ${QINGLING_VALIDATE_EXPLICIT_MODEL:false}
    model-candidates: ${QINGLING_AGENT_MODEL_CANDIDATES:qwen3.8-27b,qwen3.8-2.4t-a95b,deepseek-v4.1-flash,glm-5.3,kimi-k3,deepseek-v4-flash-0731,qwen3.7-flash-2026-07-15,qwen3.7-flash}
    model-probe-timeout: 20s
    max-iterations: 30
    max-input-tokens: 30000
    max-output-tokens: 8192
    sub-agent-max-iterations: 20
    # 必须早于 AgentScope 核心 PT5M 工具超时卸载，避免父调用超时后子任务继续悬挂。
    async-tool-offload-timeout: 30s
    # 与业务调用超时解耦，关闭时只有限等待已接纳 dispatch 排空。
    shutdown-drain-timeout: ${QINGLING_SHUTDOWN_DRAIN_TIMEOUT:30s}
    timeout: 300s
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:}}
      model-probe-url: ${QINGLING_MODEL_PROBE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    new-api:
      api-key: ${NEWAPI_API_KEY:}
      # 请求域名尚未开放时保持为空；选择 newapi Provider 后由启动校验拒绝空值。
      base-url: ${NEWAPI_BASE_URL:}
  sandbox:
    enabled: ${QINGLING_SANDBOX_ENABLED:true}
    url: ${QINGLING_SANDBOX_URL:http://localhost:8029/mcp}
    workspace-dir: /workspace
    timeout: 120s
    initialization-timeout: 30s
    max-retries: 2
    enabled-tools: [sandbox_execute_bash]
    headers: {}
  memory:
    context-dir: ${QINGLING_CONTEXT_DIR:./data/ctx}
    db-dsn: ${QINGLING_MEMORY_DB_DSN:}
    dashscope:
      # Memory 凭据与 Agent Provider 完全独立，仅在 db-dsn 非空时强制要求。
      api-key: ${QINGLING_MEMORY_DASHSCOPE_API_KEY:}
      base-url: ${QINGLING_MEMORY_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/}
      extract-model: ${QINGLING_MEMORY_EXTRACT_MODEL:qwen3.6-max-preview}
      embedding-model: ${QINGLING_MEMORY_EMBEDDING_MODEL:text-embedding-v3}
  team:
    roles: [manager, pm, rd, qa]
  debug:
    test-api-enabled: ${QINGLING_TEST_API_ENABLED:false}
    reply-timeout: 300s
  metrics:
    enabled: ${QINGLING_METRICS_ENABLED:true}
  cleanup:
    enabled: true
    run-on-startup: true
    session-retention-days: 365
    rules:
      workspace/sessions/*/tmp: 1
      workspace/sessions/*/uploads: 7
      workspace/sessions/*/outputs: 30
      traces: 30
  cron:
    tick-interval: 1s
    heartbeat-interval: 30s
    heartbeat-stagger-seconds: [0, 7, 14, 21]
  search:
    baidu-api-key: ${BAIDU_APPBUILDER_API_KEY:}
  workflow:
    # runtime v2 完成全部门禁前保持 legacy；切换 coordinated 必须显式配置。
    coordination-mode: ${QINGLING_WORKFLOW_COORDINATION_MODE:legacy}
    # Task 18 使用 STANDARD，保留四角色产物但不让可选评审和子 Agent 阻断主路径。
    default-profile: ${QINGLING_WORKFLOW_DEFAULT_PROFILE:standard}
    review-policy: ${QINGLING_WORKFLOW_REVIEW_POLICY:required-only}
    advisory-audit-enabled: ${QINGLING_WORKFLOW_ADVISORY_AUDIT_ENABLED:true}
    review-timeout: ${QINGLING_WORKFLOW_REVIEW_TIMEOUT:10m}

management:
  endpoints:
    enabled-by-default: false
